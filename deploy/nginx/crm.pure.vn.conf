# nginx site for Pure CRM → /etc/nginx/sites-available/crm.pure.vn
#   ln -s /etc/nginx/sites-available/crm.pure.vn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d crm.pure.vn      # adds the 443 server block + redirect
#
# The app listens on 127.0.0.1:3000 only; nginx is the single public entry.

upstream purecrm {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.pure.vn;

    # File attachments: MAX_UPLOAD_MB defaults to 15 → leave headroom.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # Realtime stream (Server-Sent Events): no buffering, long read timeout.
    location = /api/stream {
        proxy_pass http://purecrm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://purecrm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
