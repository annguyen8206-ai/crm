name: Deploy VitCRM
on:
  push:
    branches:
      - main
concurrency:
  group: vitcrm-production
  cancel-in-progress: true
jobs:
  test:
    name: Typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/vitcrm
            # Safety net: keep the last 7 nightly-ish DB dumps before any migration runs.
            mkdir -p "$HOME/vitcrm-backups"
            if [ -n "$DATABASE_URL" ]; then
              pg_dump "$DATABASE_URL" | gzip > "$HOME/vitcrm-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz" || echo "WARN: pg_dump failed (continuing)"
            else
              set -a; [ -f .env ] && . ./.env; set +a
              [ -n "$DATABASE_URL" ] && pg_dump "$DATABASE_URL" | gzip > "$HOME/vitcrm-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz" || echo "WARN: no DATABASE_URL for backup"
            fi
            ls -1t "$HOME/vitcrm-backups"/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            npm run lint
            pm2 restart vitcrm --update-env
            pm2 save
            sleep 3
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health
            echo "VitCRM deployment successful"
            git log -1 --oneline
            pm2 status
