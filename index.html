    <!-- Defensive polyfill for window.fetch in iframe/sandboxed environments -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var currentFetch = nativeFetch;
            
            function setupFetchProperty(target) {
              if (!target) return;
              try {
                var descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
                if (!descriptor || descriptor.configurable !== false) {
                  Object.defineProperty(target, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() {
                      return currentFetch;
                    },
                    set: function(fn) {
                      currentFetch = fn;
                    }
                  });
                }
              } catch (e) {}
            }

            setupFetchProperty(window);
            if (typeof Window !== 'undefined' && Window.prototype) {
              setupFetchProperty(Window.prototype);
            }
          }
        } catch (err) {}
      })();
    </script>
